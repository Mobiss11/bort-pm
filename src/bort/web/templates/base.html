<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Борт{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v=deal-1">
<script src="/static/vendor/htmx.min.js" defer></script>
<script src="/static/app.js?v=deal-1" defer></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="logo" href="/">
      <svg class="logo-mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="2.2" fill="#4f46e5"/>
        <rect x="13" y="3" width="8" height="8" rx="2.2" fill="#a5b4fc"/>
        <rect x="3" y="13" width="8" height="8" rx="2.2" fill="#a5b4fc"/>
        <rect x="13" y="13" width="8" height="8" rx="2.2" fill="#4f46e5"/>
      </svg>
      <span>Борт</span>
    </a>
    <nav class="topnav" aria-label="Основная навигация">
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Сводка</a>
      <a href="/work" {% if request.url.path == '/work' %}aria-current="page"{% endif %}>Работа</a>
      <a href="/ai" {% if request.url.path == '/ai' %}aria-current="page"{% endif %}>AI</a>
      <a href="/tasks" {% if request.url.path == '/tasks' %}aria-current="page"{% endif %}>Задачи</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<div class="global-spinner" aria-hidden="true"></div>
</body>
</html>
