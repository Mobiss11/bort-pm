{# Форма правки задачи (за раскрытием). Сохраняет фильтры/вид через hidden-поля. #}
<section id="task-edit-box" class="inline-form compact">
  <form hx-post="/ui/tasks/{{ t.id }}/edit" hx-target="{{ board_target }}" hx-swap="outerHTML">
    <input type="hidden" name="view" value="{{ view }}">
    <input type="hidden" name="q" value="{{ q }}">
    <input type="hidden" name="filter_project_id" value="{{ project_id }}">
    <div class="form-grid">
      <label class="span2">Задача
        <input name="title" value="{{ t.title }}" required maxlength="300">
      </label>
      <label>Приоритет
        <select name="priority">
          {% for code, title in enums.priorities %}
          <option value="{{ code }}" {{ 'selected' if code == t.priority else '' }}>{{ title }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Дедлайн
        <input type="date" name="deadline" value="{{ t.deadline or '' }}">
      </label>
      <label>Статус
        <select name="status">
          {% for code, title in enums.task_statuses %}
          <option value="{{ code }}" {{ 'selected' if code == t.status else '' }}>{{ title }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary btn-small" type="submit">Сохранить</button>
      <button class="btn btn-small" type="button" hx-delete="/ui/tasks/{{ t.id }}"
              hx-target="{{ board_target }}" hx-swap="outerHTML"
              hx-confirm="Удалить задачу «{{ t.title }}»?">Удалить</button>
    </div>
  </form>
</section>
