{# Статус проекта, редактируемый на месте. В сводке перерисовывает таблицу целиком:
   смена статуса переносит проект между «Открытыми» и «Закрытыми» и меняет счётчики. #}
<select class="status-edit status-{{ p.status }}" name="status" aria-label="Статус проекта «{{ p.name }}»"
        title="Сменить статус"
        hx-post="/ui/projects/{{ p.id }}/fields"
        {% if status_view == 'card' %}
        hx-vals='{"view": "card"}'
        hx-target="#project-head-box" hx-swap="outerHTML"
        {% else %}
        hx-target="#projects-table-box" hx-swap="innerHTML"
        {# Фильтры сводки задаются только через URL — форму #filters убрали с экрана,
           поэтому текущие q/tasks едут явными значениями, а не hx-include. #}
        hx-vals='{"q": {{ q|default('')|tojson }}, "tasks": {{ tasks_filter|default('')|tojson }}}'
        {% endif %}>
  {% for code, title in enums.project_statuses %}
  <option value="{{ code }}" {{ 'selected' if p.status == code else '' }}>{{ title }}</option>
  {% endfor %}
</select>
