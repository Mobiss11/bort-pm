<select class="dl-edit" name="deadline"
        hx-post="/ui/projects/{{ p.id }}/fields" hx-target="closest tr" hx-swap="outerHTML"
        title="Поставить/снять дедлайн" aria-label="Дедлайн проекта">
  <option value="">— нет —</option>
  {% for n in [1, 7, 14, 30] %}
  <option value="{{ dl_suggest[n] }}" {{ 'selected' if p.deadline == dl_suggest[n] else '' }}>+{{ n }} дн.</option>
  {% endfor %}
  {% if p.deadline and p.deadline not in dl_suggest.values() %}
  <option value="{{ p.deadline }}" selected>{{ p.deadline|date_ru }} (текущий)</option>
  {% endif %}
</select>
