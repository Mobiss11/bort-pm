<tr class="task-row {{ 'task-closed' if t.status in ('done','cancelled') else '' }}">
  <td class="nowrap">
    <select class="status-select st-sel-{{ t.status }}" name="status"
            hx-post="/ui/tasks/{{ t.id }}/status" hx-target="#tasks-block" hx-swap="outerHTML"
            hx-vals='{"view": "list", "q": "{{ q }}"}'>
      {% for item in enums.task_statuses %}
      <option value="{{ item.code }}" {{ 'selected' if item.code == t.status else '' }}>{{ item.title_ru }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="task-title-cell">
    <span class="task-title" title="{{ t.title }}">{{ t.title }}</span>
  </td>
  <td><span class="prio prio-{{ t.priority }}">{{ t.priority|label('priorities') }}</span></td>
  <td class="nowrap">
    {% if t.deadline %}{{ t.deadline|date_ru }} <span class="days d-none">{{ t.deadline|days_left_str }}</span>
    {% else %}<span class="muted">—</span>{% endif %}
  </td>
</tr>
