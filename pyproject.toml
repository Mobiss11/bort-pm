[project]
name = "bort"
version = "0.1.0"
description = "«Борт» — персональная система управления проектами: сводка, деньги, дедлайны"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "mcp>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
